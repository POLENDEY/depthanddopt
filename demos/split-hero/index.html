<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Depth &amp; Dot · Split hero</title>
    <script>
      document.documentElement.classList.add("js");
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="split-hero" data-reveal>
        <div class="split-hero__copy">
          <p class="split-hero__eyebrow">3D print studio</p>
          <h1 class="split-hero__title">Objects made to be kept.</h1>
          <p class="split-hero__lead">
            Custom keychains, name pieces, and wall objects, printed to order in solid color.
          </p>
          <div class="split-hero__actions">
            <a class="split-hero__button" href="#products">View products</a>
            <a class="split-hero__button split-hero__button--quiet" href="#inquire">Start an inquiry</a>
          </div>
        </div>

        <figure class="split-hero__media">
          <img
            src="studio.webp"
            width="1600"
            height="1200"
            fetchpriority="high"
            alt="A green low-poly 3D printed figure of a muscular character bursting out of a white wall, with one clenched fist breaking through beside it."
          />
        </figure>
      </section>
    </main>
  </body>
</html>
